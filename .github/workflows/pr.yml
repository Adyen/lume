# This workflow will:
#   1. Do a clean installation of node dependencies
#   2. Run unit tests
#   3. Build the package
#   4. Scan push/PRs for leaked credentials using TruffleHog

name: PR workflow

on:
  pull_request:
    branches: ['main']

jobs:
  build:
    name: Setup & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v3

      - name: Use Node version from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        uses: pnpm/action-setup@v2
        with:
          version: 8
          run_install: true

      - name: Build the package
        run: pnpm run build
    permissions:
      contents: read

  run-unit-tests:
    name: Test on latest LTS Node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node version from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        uses: pnpm/action-setup@v2
        with:
          version: 8
          run_install: true

      - name: Run unit tests (with experimental VM modules)
        run: pnpm run test
    permissions:
      contents: read

  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
    permissions:
      contents: read
